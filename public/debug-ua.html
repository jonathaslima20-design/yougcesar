<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagnostico</title>
</head>
<body style="font-family: monospace; padding: 16px; word-break: break-all; font-size: 15px; line-height: 1.6;">
  <h3>Diagnostico de navegador</h3>
  <p id="out"></p>
  <script>
    document.getElementById('out').innerHTML = [
      'userAgent: ' + navigator.userAgent,
      'outerWidth: ' + window.outerWidth,
      'outerHeight: ' + window.outerHeight,
      'innerWidth: ' + window.innerWidth,
      'innerHeight: ' + window.innerHeight,
      'standalone: ' + navigator.standalone,
      'visualViewport.width: ' + (window.visualViewport ? window.visualViewport.width : 'n/a'),
      'screen.width: ' + screen.width,
      'screen.height: ' + screen.height,
    ].join('<br>');
  </script>
</body>
</html>
