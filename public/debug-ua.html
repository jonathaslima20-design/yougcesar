<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagnostico</title>
</head>
<body style="font-family: monospace; padding: 16px; word-break: break-all; font-size: 15px; line-height: 1.6;">
  <h3>Diagnostico de navegador</h3>
  <p id="out"></p>
  <script>
    const webkitHandlers = (window.webkit && window.webkit.messageHandlers)
      ? Object.keys(window.webkit.messageHandlers).join(', ') || '(objeto vazio)'
      : 'ausente';
    document.getElementById('out').innerHTML = [
      'userAgent: ' + navigator.userAgent,
      'outerWidth: ' + window.outerWidth,
      'outerHeight: ' + window.outerHeight,
      'innerWidth: ' + window.innerWidth,
      'innerHeight: ' + window.innerHeight,
      'standalone: ' + navigator.standalone,
      'webkit.messageHandlers: ' + webkitHandlers,
      'document.referrer: ' + (document.referrer || '(vazio)'),
      'history.length: ' + window.history.length,
      'maxTouchPoints: ' + navigator.maxTouchPoints,
      'screen: ' + screen.width + 'x' + screen.height,
    ].join('<br>');
  </script>
</body>
</html>
